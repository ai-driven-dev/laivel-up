name: Annuaire des inscrits

# Une issue d'inscription ajoute son auteur à directory.json.
# Une issue de désinscription l'en retire. Dans les deux cas l'issue est
# fermée avec un mot, et le fichier committé sur main.
#
# Le label est posé par le formulaire d'issue, côté serveur : personne ne
# peut le mettre à la main sans droits de triage. C'est lui le déclencheur,
# pas le titre ni le corps, qui eux sont libres.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: directory
  cancel-in-progress: false

jobs:
  update:
    if: >-
      contains(github.event.issue.labels.*.name, 'inscription')
      || contains(github.event.issue.labels.*.name, 'desinscription')
    runs-on: ubuntu-latest
    steps:
      # Les inscriptions ferment à l'ouverture du hackathon. Le dépôt reste
      # public et le formulaire reste atteignable — on ne peut pas retirer un
      # gabarit d'issue à quelqu'un qui a le lien — donc c'est ici que la
      # fermeture se joue, pas dans l'interface.
      #
      # C'est la date de création de l'issue qui compte, jamais celle du run :
      # même règle que pour les rendus, et elle ne dépend pas de la charge des
      # runners GitHub.
      #
      # Une désinscription n'est jamais refusée : quelqu'un qui ne peut plus
      # venir doit pouvoir se retirer jusqu'au bout.
      #
      # L'échéance est écrite ici en clair. Elle vaut `opensAt` de
      # `ai-driven-dev.fr/src/data/hackathon.ts`, dans un autre dépôt : les deux
      # doivent bouger ensemble si l'édition est décalée.
      - name: Contrôler l'échéance
        id: echeance
        env:
          CREEE_LE: ${{ github.event.issue.created_at }}
          INSCRIPTION: ${{ contains(github.event.issue.labels.*.name, 'inscription') }}
        run: |
          limite='2026-08-28T12:00:00+02:00'
          # Les deux conversions peuvent échouer — format inattendu, `date` d'une
          # autre image. On accepte alors l'inscription : perdre quelqu'un de
          # légitime coûte plus cher que d'en laisser passer un en retard.
          creee=$(date -u -d "$CREEE_LE" +%s 2>/dev/null || true)
          echeance=$(date -u -d "$limite" +%s 2>/dev/null || true)
          if [ -z "$creee" ] || [ -z "$echeance" ]; then
            echo "::warning::date illisible ($CREEE_LE), inscription acceptée par défaut"
            echo 'tardive=false' >> "$GITHUB_OUTPUT"
          elif [ "$INSCRIPTION" = 'true' ] && [ "$creee" -ge "$echeance" ]; then
            echo "Inscription ouverte le $CREEE_LE, après $limite : refusée."
            echo 'tardive=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tardive=false' >> "$GITHUB_OUTPUT"
          fi

      # `gh` déduit le dépôt du dossier courant, et cette étape tourne avant le
      # checkout : sans `GH_REPO`, elle échoue sur « not a git repository » et
      # l'inscription tardive reste ouverte, sans réponse. Vu en vrai sur #36.
      - name: Répondre à une inscription tardive
        if: steps.echeance.outputs.tardive == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Les inscriptions sont closes : elles fermaient à l'ouverture, le vendredi 28 août à midi. Tu n'apparaîtras pas dans l'annuaire et ton rendu ne sera pas retenu pour cette édition.

          Le sujet reste public et le Discord est ouvert — rien n'empêche de faire l'exercice dans ton coin, et on y annoncera la prochaine édition."
          gh issue close "${{ github.event.issue.number }}"

      - uses: actions/checkout@v4
        if: steps.echeance.outputs.tardive != 'true'

      - uses: actions/setup-node@v4
        if: steps.echeance.outputs.tardive != 'true'
        with:
          node-version: '22'

      - name: Mettre à jour l'annuaire
        id: update
        if: steps.echeance.outputs.tardive != 'true'
        run: |
          if [ "${{ contains(github.event.issue.labels.*.name, 'inscription') }}" = "true" ]; then
            node .github/scripts/update-directory.mjs inscription
          else
            node .github/scripts/update-directory.mjs desinscription
          fi

      - name: Committer
        if: steps.echeance.outputs.tardive != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add directory.json
          git diff --staged --quiet && { echo 'Rien à committer.'; exit 0; }
          git commit -m "chore(annuaire): ${{ steps.update.outputs.login }} (#${{ github.event.issue.number }})"
          git push

      - name: Répondre et fermer
        if: steps.echeance.outputs.tardive != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSCRIPTION: ${{ contains(github.event.issue.labels.*.name, 'inscription') }}
          COUNT: ${{ steps.update.outputs.count }}
        run: |
          if [ "$INSCRIPTION" = "true" ]; then
            MESSAGE="C'est noté, tu es le n°$COUNT sur la liste 🎉 Rendez-vous sur le Discord à l'ouverture, le vendredi à midi. Si tu ne peux plus venir, ouvre une issue « Se désinscrire », ça prend dix secondes."
          else
            MESSAGE="Tu es retiré de la liste. Merci de nous avoir prévenus, et à une prochaine."
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$MESSAGE"
          gh issue close "${{ github.event.issue.number }}"
