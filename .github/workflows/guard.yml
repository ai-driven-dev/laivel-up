name: Garde-fou

# Ce dépôt est public et voisine du matériel d'évaluation qui, lui, ne l'est
# pas. Deux erreurs seraient irrattrapables : publier un profil que le jury
# garde, ou publier les réponses attendues.
#
# Le contrôle principal est une **liste blanche**, pas une liste noire. Une
# liste noire oblige à écrire ici le nom des choses à cacher, c'est-à-dire à
# publier la nomenclature du confidentiel dans le dépôt public — ce que ce
# fichier faisait jusqu'au 20 août. Une liste blanche dit seulement ce qui a le
# droit d'exister, et refuse tout le reste sans le nommer.

on:
  push:
  pull_request:

jobs:
  inventaire:
    name: Rien d'inattendu dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique complet. Un fichier commité puis supprimé au commit
          # suivant reste servi indéfiniment par l'API et par les forks : c'est
          # le seul cas qu'on ne peut pas rattraper, et l'arbre courant ne le
          # montre pas.
          fetch-depth: 0

      - name: Seuls les chemins attendus existent
        run: |
          set -euo pipefail
          autorises='^(README|SUJET)\.md$|^LICENSE$|^\.gitignore$|^directory\.json$|^\.github/|^assets/|^levels/|^profiles/(README\.md|perceval/|bohort/|leodagan/|arthur/)'
          intrus=$(git ls-files | grep -vE "$autorises" || true)
          if [ -n "$intrus" ]; then
            echo "::error::Des chemins non prévus sont suivis par git :"
            echo "$intrus"
            echo "Ajouter le chemin à la liste blanche ci-dessus s'il est légitime."
            exit 1
          fi
          echo "Inventaire conforme."

      - name: L'historique complet ne contient que des chemins attendus
        run: |
          set -euo pipefail
          # Un fichier commité puis supprimé reste servi indéfiniment par l'API
          # et par les forks : c'est le seul cas qu'on ne peut pas rattraper.
          # La même liste blanche, appliquée à tous les objets jamais commités.
          autorises='^(README|SUJET)\.md$|^LICENSE$|^\.gitignore$|^directory\.json$|^\.github/|^assets/|^levels/|^profiles/(README\.md|perceval/|bohort/|leodagan/|arthur/)$?'
          intrus=$(git rev-list --objects --all \
            | awk '{ $1=""; print substr($0,2) }' \
            | grep -v '^$' \
            | grep -vE "$autorises" | sort -u || true)
          if [ -n "$intrus" ]; then
            echo "::error::Des chemins non prévus existent dans l'historique :"
            echo "$intrus"
            exit 1
          fi
          echo "Historique conforme."

      - name: Aucun caractère de contrôle
        run: |
          set -euo pipefail
          # Le mode de panne du 19 août : des U+001F invisibles dans un éditeur,
          # rendus par des losanges sur GitHub. Aucun contrôle ne les voyait, et
          # c'est la personne qui a lu la page en production qui les a trouvés.
          sales=$(grep -rlIP '[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]|\xef\xbf\xbd' \
            --exclude-dir=.git . || true)
          if [ -n "$sales" ]; then
            echo "::error::Caractères de contrôle détectés dans :"
            echo "$sales"
            exit 1
          fi
          echo "Aucun caractère de contrôle."

      - name: L'en-tête du référentiel est du YAML valide
        run: |
          set -euo pipefail
          # Il a été publié cassé le 19 août : `label` et `rank` indentés au
          # même niveau que le tiret de la séquence. Le sujet demande aux
          # participants d'y lire les `level_id` ; tout parseur standard échoue.
          # Notre lecteur maison, lui, tolérait — donc rien ne l'a vu.
          # PyYAML est présent sur les images GitHub, mais l'installer coûte
          # une seconde et évite qu'un changement d'image transforme ce
          # contrôle en échec inexpliqué un vendredi midi.
          # PyYAML est préinstallé sur les images GitHub. On tente quand même,
          # sans faire échouer l'étape si l'environnement le refuse.
          python3 -m pip install --quiet --disable-pip-version-check pyyaml 2>/dev/null || true
          if [ -f levels/aidd.md ]; then
            python3 - <<'PY'
          import re, sys, yaml
          texte = open('levels/aidd.md', encoding='utf-8').read()
          entete = re.match(r'^---\n(.*?)\n---', texte, re.S)
          if not entete:
              sys.exit("en-tête YAML introuvable dans levels/aidd.md")
          data = yaml.safe_load(entete.group(1))
          if not data.get('id') or not data.get('levels'):
              sys.exit("l'en-tête ne porte pas `id` et `levels`")
          for niveau in data['levels']:
              if 'id' not in niveau or 'rank' not in niveau:
                  sys.exit(f"niveau incomplet : {niveau}")
          print(f"{len(data['levels'])} niveaux lus par PyYAML.")
          PY
          else
            echo "levels/aidd.md absent, rien à contrôler."
          fi

  tests:
    name: L'annuaire se comporte comme prévu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/update-directory.test.mjs

  secrets:
    name: Aucun secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le binaire et non `gitleaks/gitleaks-action`, qui exige une licence
      # payante dès que le dépôt appartient à une organisation. Même outil,
      # mêmes règles, sans la facture ni un secret de plus à tenir.
      - name: Scanner l'historique
        env:
          VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
